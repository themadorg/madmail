name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Prepare unstable release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install signature verification dependency for tests
        run: python3 -m pip install cryptography==46.0.3

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Prepare and push release
        id: release
        run: python3 scripts/release.py --write --push --github-output "$GITHUB_OUTPUT"

      - name: Verify all workspace and manifest versions
        run: python3 scripts/release.py --check

      - name: Upload version artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-versions
          path: .version
          retention-days: 7

  lint:
    name: Lint
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config perl

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signature verification dependency for tests
        run: python3 -m pip install cryptography==46.0.3

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify release manifests
        run: python3 scripts/release.py --check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Cargo audit
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, release]
    if: always() && needs.lint.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - name: Download computed version files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: release-versions
          path: .

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config perl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-release

      - uses: oven-sh/setup-bun@v2
      - name: Build admin UI
        working-directory: external/madmail-admin-web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: cargo build --release
        env:
          CHATMAIL_ADMIN_WEB_BUILD: ${{ github.workspace }}/external/madmail-admin-web/build
        run: cargo build --release --locked --bin madmail

      - name: Read build version
        id: version
        run: |
          if [ -f .version ]; then
            echo "VERSION=$(cat .version)" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }')" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload madmail binary
        uses: actions/upload-artifact@v4
        with:
          name: madmail-linux-x86_64-${{ steps.version.outputs.VERSION }}
          path: target/release/madmail
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madmail
          POSTGRES_PASSWORD: madmail
          POSTGRES_DB: madmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madmail -d madmail_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://madmail:madmail@127.0.0.1:5432/madmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config perl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: cargo test
        run: cargo test --workspace

  unstable-windows:
    name: Unsigned Windows unstable binary
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.tag != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Build admin UI
        working-directory: external/madmail-admin-web
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build unsigned Windows binary
        env:
          CHATMAIL_ADMIN_WEB_BUILD: ${{ github.workspace }}/external/madmail-admin-web/build
        run: cargo build --release --locked --bin madmail
      - uses: actions/upload-artifact@v4
        with:
          name: unstable-windows
          path: target/release/madmail.exe
          if-no-files-found: error

  unstable-prerelease:
    name: Publish testing prerelease
    runs-on: ubuntu-latest
    needs: [release, build, test, unstable-windows]
    if: >-
      always() && needs.release.result == 'success' &&
      needs.release.outputs.tag != '' && needs.build.result == 'success' &&
      needs.test.result == 'success' && needs.unstable-windows.result == 'success'
    permissions:
      contents: write
    concurrency:
      group: unstable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: madmail-linux-x86_64-${{ needs.release.outputs.version }}
          path: linux-bin
      - uses: actions/download-artifact@v4
        with:
          name: unstable-windows
          path: windows-bin
      - name: Stage unsigned binaries
        run: |
          mkdir unsigned
          cp linux-bin/madmail unsigned/madmail-linux-amd64
          cp windows-bin/madmail.exe unsigned/madmail-windows-amd64.exe
      - name: Publish testing-only prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ needs.release.outputs.tag }}
        run: python3 scripts/publish.py --write unstable --candidate "$CANDIDATE" --artifacts unsigned

  docker-build-push:
    name: Publish unstable Docker image
    runs-on: ubuntu-latest
    needs: [release, unstable-prerelease]
    if: needs.unstable-prerelease.result == 'success'
    concurrency:
      group: unstable-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable image
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
          VERSION: ${{ needs.release.outputs.version }}
        run: python3 scripts/registry_image.py --repository "$GITHUB_REPOSITORY" --tag "$VERSION-unstable" --sha "$SOURCE_SHA"
      - name: Build immutable unstable image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}-unstable
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}-unstable
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Advance unstable alias only for newest versioned build
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          CANDIDATE: ${{ needs.release.outputs.tag }}
        run: |
          git fetch origin main --tags
          newest=$(python3 -c 'import sys; sys.path.insert(0,"scripts"); import release; from pathlib import Path; print(release.latest_release_at(Path.cwd(), "origin/main"))')
          if [ "$newest" = "$CANDIDATE" ]; then
            docker buildx imagetools create --tag "$IMAGE:unstable" "$IMAGE:$VERSION-unstable"
          fi

  landing:
    name: Landing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build landing
        working-directory: landing
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/build

  deploy-landing:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: landing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://madmail.chat
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
