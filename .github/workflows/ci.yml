name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p test_release.py -v

      - name: Prepare and push release
        id: release
        run: python3 scripts/release.py --write --push --github-output "$GITHUB_OUTPUT"

      - name: Verify all workspace and manifest versions
        run: python3 scripts/release.py --check

      - name: Upload version artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-versions
          path: .version
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config perl

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p test_release.py -v

      - name: Verify release manifests
        run: python3 scripts/release.py --check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, release]
    if: always() && needs.lint.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - name: Download computed version files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: release-versions
          path: .

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config perl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-release

      - name: cargo build --release
        run: cargo build --release --locked --bin madmail

      - name: Read build version
        id: version
        run: |
          if [ -f .version ]; then
            echo "VERSION=$(cat .version)" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }')" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload madmail binary
        uses: actions/upload-artifact@v4
        with:
          name: madmail-linux-x86_64-${{ steps.version.outputs.VERSION }}
          path: target/release/madmail
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madmail
          POSTGRES_PASSWORD: madmail
          POSTGRES_DB: madmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madmail -d madmail_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://madmail:madmail@127.0.0.1:5432/madmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config perl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: cargo test
        run: cargo test --workspace

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [build, release]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - name: Download computed version files
        uses: actions/download-artifact@v4
        with:
          name: release-versions
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          if [ -f .version ]; then
            echo "VERSION=$(cat .version)" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }')" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta (Madmail)
        id: meta-madmail
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.VERSION }}

      - name: Build and Push Madmail Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-madmail.outputs.tags }}
          labels: ${{ steps.meta-madmail.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  landing:
    name: Landing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build landing
        working-directory: landing
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/build

  deploy-landing:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: landing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://madmail.chat
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
