# Windows pipeline
#
# - Merges / pushes to main (+ Windows-related PRs): lint, amd64 smoke, arm64 compile
# - Manual stable-setup: package the already signed server from a draft release
# - workflow_dispatch without a candidate: validate only
name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "crates/chatmail/**"
      - "crates/chatmail-config/**"
      - "crates/madmail-tray/**"
      - "packaging/windows/**"
      - "scripts/build-windows.sh"
      - ".github/workflows/windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Unstable tag to package for its staged stable draft (empty = validate only)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Validation (main merges, PRs, manual) — not on Release ─────────────────
  linux-windows-crates:
    name: Linux (windows-related crates)
    if: github.event_name != 'workflow_dispatch' || inputs.candidate == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-related-linux

      - name: Test tray + config CLI pieces
        run: |
          cargo test -p madmail-tray
          cargo test -p chatmail-config --lib service_subcommands
          cargo test -p chatmail-config --lib firewall_subcommands
          cargo test -p chatmail --lib tls_boot
          cargo test -p chatmail --lib service_cmd
          cargo test -p chatmail --lib firewall_cmd

      - name: Packaging files present
        run: |
          test -f packaging/windows/Madmail.iss
          test -f packaging/windows/build-setup.ps1
          test -f packaging/windows/README.md
          test -f scripts/build-windows.sh

  # ── amd64 smoke (main, PRs, release, manual) ───────────────────────────────
  windows-amd64-smoke:
    name: Windows amd64 smoke
    if: github.event_name != 'workflow_dispatch' || inputs.candidate == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-amd64-smoke

      - name: Build madmail + madmail-tray (MSVC)
        # -D warnings: fail on rustc warnings.
        # link-arg=/IGNORE:4099: silence MSVC LNK4099 (missing ossl_static.pdb from vendored OpenSSL).
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          RUSTFLAGS: "-D warnings -C link-arg=/IGNORE:4099"
        run: cargo build -p chatmail -p madmail-tray --release

      - name: Tray smoke-exit
        shell: pwsh
        run: |
          & .\target\release\madmail-tray.exe --smoke-exit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Service status when not installed
        shell: pwsh
        run: |
          # Must exit 0 with State NotInstalled (not sc error 1060).
          $out = & .\target\release\madmail.exe service status 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "service status failed: $LASTEXITCODE" }
          if ($out -notmatch "NotInstalled") { throw "expected NotInstalled, got: $out" }

      - name: Local install (self-signed) under temp dirs
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "madmail-cfg"
          $st = Join-Path $env:RUNNER_TEMP "madmail-state"
          New-Item -ItemType Directory -Force -Path $cfg, $st | Out-Null
          & .\target\release\madmail.exe install `
            --simple --ip 127.0.0.1 --tls-mode self_signed --lang en `
            --config-dir $cfg --state-dir $st `
            --no-obtain-certificate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cert = Join-Path $cfg "certs\fullchain.pem"
          $key = Join-Path $cfg "certs\privkey.pem"
          if (-not (Test-Path $cert)) { throw "missing $cert" }
          if (-not (Test-Path $key)) { throw "missing $key" }
          $conf = Join-Path $cfg "madmail.conf"
          if (-not (Test-Path $conf)) { throw "missing $conf (binary_name .exe strip?)" }
          Write-Host "install ok: certs present under $cfg"

      - name: Firewall CLI parse (apply needs admin; only dry presence)
        shell: pwsh
        run: |
          & .\target\release\madmail.exe firewall --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows binaries (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: madmail-windows-amd64-ci
          path: |
            target/release/madmail.exe
            target/release/madmail-tray.exe
          retention-days: 7

  # ── arm64 compile-only (main merges / PRs / manual — not Release) ──────────
  windows-arm64-compile:
    name: Windows arm64 compile-only
    if: github.event_name != 'workflow_dispatch' || inputs.candidate == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-arm64-compile

      - name: cargo check arm64 (server + tray)
        shell: pwsh
        env:
          RUSTFLAGS: "-D warnings -C link-arg=/IGNORE:4099"
        run: |
          cargo check -p chatmail -p madmail-tray --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-amd64-setup:
    name: Package signed stable server from draft
    if: github.event_name == 'workflow_dispatch' && inputs.candidate != ''
    runs-on: windows-latest
    concurrency:
      group: stable-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Validate candidate and resolve source
        id: candidate
        shell: pwsh
        run: |
          if ($env:CANDIDATE -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-unstable$') { throw "Invalid candidate" }
          $stable = $env:CANDIDATE -replace '-unstable$', ''
          $draft = gh release view $stable --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft -or $draft.isPrerelease) { throw "Expected stable draft" }
          if ($draft.targetCommitish -notmatch '^[0-9a-f]{40}$') { throw "Expected exact source SHA" }
          "sha=$($draft.targetCommitish)" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
      - name: Get current verification helper
        # Older selected candidates predate this helper. The workflow implementation
        # is taken from its trusted dispatch revision, never from an arbitrary ref.
        shell: pwsh
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git show "${env:WORKFLOW_SHA}:scripts/artifact_signing.py" | Set-Content -Encoding utf8 artifact_signing.py
          if ($LASTEXITCODE -ne 0) { throw "Missing verification helper" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Download and verify signed server
        shell: pwsh
        env:
          STABLE: ${{ steps.candidate.outputs.stable }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          gh release download $env:STABLE --repo $env:GITHUB_REPOSITORY --dir build
          if ($LASTEXITCODE -ne 0) { throw "Draft download failed" }
          python artifact_signing.py build/madmail-windows-amd64.exe --checksums build/binary-checksums.txt
          if ($LASTEXITCODE -ne 0) { throw "Signature/checksum verification failed" }
          $manifest = Get-Content build/release.json -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:SOURCE_SHA -or $manifest.candidate -ne $env:CANDIDATE -or $manifest.version -ne ($env:STABLE -replace '^v','')) { throw "Provenance mismatch" }
          $tagSha = git rev-parse "refs/tags/$($env:CANDIDATE)^{commit}"
          $stableSha = git rev-parse "refs/tags/$($env:STABLE)^{commit}"
          if ($tagSha -ne $env:SOURCE_SHA -or $stableSha -ne $env:SOURCE_SHA) { throw "Tag mismatch" }
          $binaryVersion = & ./build/madmail-windows-amd64.exe version
          if ($LASTEXITCODE -ne 0 -or $binaryVersion -notmatch ([regex]::Escape($manifest.version) + '(\s|$)')) { throw "Binary version mismatch" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer or verify existing installer on resume
        shell: pwsh
        env:
          STABLE: ${{ steps.candidate.outputs.stable }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          $setup = 'build/madmail-windows-amd64-setup.exe'
          $package = 'build/setup-package.zip'
          $serverHash = (Get-FileHash build/madmail-windows-amd64.exe -Algorithm SHA256).Hash.ToLower()
          if (Test-Path $package) {
            Expand-Archive $package -DestinationPath setup-resume
            python -c "from pathlib import Path; from artifact_signing import verify_checksums; verify_checksums(Path('setup-resume'), 'setup-checksums.txt')"
            if ($LASTEXITCODE -ne 0) { throw "Existing installer verification failed" }
            $receipt = Get-Content setup-resume/setup-source.json -Raw | ConvertFrom-Json
            if ($receipt.source_commit -ne $env:SOURCE_SHA -or $receipt.server_sha256 -ne $serverHash) { throw "Installer provenance mismatch" }
            Write-Host 'Installer already uploaded; verified, leaving draft for secure finalization.'
          } else {
            & ./packaging/windows/build-setup.ps1 -Arch amd64
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setup)) { throw "Installer build failed" }
            if ((Get-FileHash build/madmail-windows-amd64.exe -Algorithm SHA256).Hash.ToLower() -ne $serverHash) { throw "Server was modified" }
            @{ source_commit = $env:SOURCE_SHA; server_sha256 = $serverHash } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 build/setup-source.json
            $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
            $receiptHash = (Get-FileHash build/setup-source.json -Algorithm SHA256).Hash.ToLower()
            "$setupHash  madmail-windows-amd64-setup.exe`n$receiptHash  setup-source.json" | Set-Content -Encoding utf8 build/setup-checksums.txt
            Compress-Archive -Path $setup,build/setup-source.json,build/setup-checksums.txt -DestinationPath $package
            gh release upload $env:STABLE $package --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Installer upload failed; rerun to verify any completed upload" }
          }
          # The signed portable executable is never uploaded or overwritten here.
