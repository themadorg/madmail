<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(function () {
				var d = document.documentElement;
				d.classList.add('js');
				try {
					var mode = localStorage.getItem('madmail-theme') || (localStorage.getItem('madmail-light') === 'true' ? 'light' : 'system');
					var light = mode === 'light' || (mode !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
					d.dataset.theme = light ? 'light' : 'dark';
					if (light) d.dataset.light = '';
				} catch (_) {}
				var p = location.pathname;
				d.classList.toggle('docs-theme', /^\/(docs|releases|blog)(\/|$)/.test(p));
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
