<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				const mode = localStorage.getItem('madmail-theme') || (localStorage.getItem('madmail-light') === 'true' ? 'light' : 'system');
				if (mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
					document.documentElement.dataset.light = '';
				}
			} catch (_) {}
			document.documentElement.classList.toggle('docs-theme', location.pathname === '/docs' || location.pathname.startsWith('/docs/') || location.pathname === '/releases' || location.pathname.startsWith('/releases/'));
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
