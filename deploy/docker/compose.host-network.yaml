# Host networking override for production calls (TURN) and real client IPs.
#
#   docker compose -f compose.yaml -f compose.host-network.yaml up -d
#
# madmail binds directly on the host, so no port mappings are needed (or
# allowed). Open the ports in the host and cloud firewall instead; see
# docs/guide/docker.md#ports. Requires Docker Compose v2.24+ for `!reset`.
#
# On the host network only root can bind ports below 1024, so madmail runs as
# root here, still with every capability dropped except NET_BIND_SERVICE, and
# bootstrap gives the directories to root (MADMAIL_UID/MADMAIL_GID are ignored).

services:
  bootstrap:
    environment:
      # Keep madmail's default TURN relay range (49152-65535).
      MADMAIL_RELAY_PORT_MIN: ""
      MADMAIL_RELAY_PORT_MAX: ""
      MADMAIL_UID: "0"
      MADMAIL_GID: "0"

  madmail:
    network_mode: host
    ports: !reset []
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
    tmpfs: !override
      - /tmp
      - /run/madmail:mode=0700
