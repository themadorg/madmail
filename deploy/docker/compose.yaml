# Madmail — Docker Compose deployment.
#
#   cd deploy/docker
#   cp .env.example .env        # then edit .env
#   docker compose up -d
#
# Production calls (TURN) work best with host networking:
#   docker compose -f compose.yaml -f compose.host-network.yaml up -d
#
# The one-shot `bootstrap` service runs `madmail install` the first time
# (when ${MADMAIL_CONFIG_DIR}/madmail.conf does not exist yet) and exits.
# On every run it also gives both host directories to MADMAIL_UID:MADMAIL_GID
# and closes them to other host users. `madmail` starts only after bootstrap
# succeeds, as that non-root user, with no capabilities and a read-only root
# filesystem. Later `up` runs skip the install because the config is present.
#
# Full guide: docs/guide/docker.md#docker-compose-example

x-madmail-image: &madmail-image ${MADMAIL_IMAGE:-ghcr.io/themadorg/madmail:latest}

services:
  bootstrap:
    image: *madmail-image
    restart: "no"
    # Root, so it can bind :80 for Let's Encrypt and hand the directories to
    # MADMAIL_UID:MADMAIL_GID. It runs for a few seconds and exits.
    security_opt:
      - no-new-privileges:true
    # Host networking instead of a published :80, which would clash with
    # `madmail` on every later `docker compose up`. Port 80 is only bound
    # during the first install (Let's Encrypt HTTP-01); later runs skip it.
    network_mode: host
    environment:
      MADMAIL_DOMAIN: ${MADMAIL_DOMAIN:-}
      MADMAIL_HOSTNAME: ${MADMAIL_HOSTNAME:-}
      MADMAIL_PUBLIC_IP: ${MADMAIL_PUBLIC_IP:?set MADMAIL_PUBLIC_IP in .env (public IP clients reach)}
      MADMAIL_TLS_MODE: ${MADMAIL_TLS_MODE:-}
      MADMAIL_ACME_EMAIL: ${MADMAIL_ACME_EMAIL:-}
      MADMAIL_LANG: ${MADMAIL_LANG:-en}
      MADMAIL_ENABLE_IROH: ${MADMAIL_ENABLE_IROH:-false}
      MADMAIL_INSTALL_EXTRA_ARGS: ${MADMAIL_INSTALL_EXTRA_ARGS:-}
      # TURN relay range written into madmail.conf; must match the published
      # UDP range below. Empty (host-network override) keeps madmail's default.
      MADMAIL_RELAY_PORT_MIN: ${MADMAIL_TURN_RELAY_MIN-50000}
      MADMAIL_RELAY_PORT_MAX: ${MADMAIL_TURN_RELAY_MAX-50099}
      # Owner of the state and config directories; must match `user` below.
      MADMAIL_UID: ${MADMAIL_UID:-999}
      MADMAIL_GID: ${MADMAIL_GID:-999}
    volumes:
      - ${MADMAIL_STATE_DIR:-/var/lib/madmail}:/var/lib/madmail
      - ${MADMAIL_CONFIG_DIR:-/etc/madmail}:/etc/madmail
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        conf=/etc/madmail/madmail.conf
        own() {
          # Hand both trees to the runtime user (only when the top-level owner
          # differs, so later runs stay fast) and keep other host users out:
          # madmail.conf holds the TURN and Shadowsocks secrets.
          for d in /var/lib/madmail /etc/madmail; do
            if [ "$$(stat -c %u:%g "$$d")" != "$$MADMAIL_UID:$$MADMAIL_GID" ]; then
              chown -R "$$MADMAIL_UID:$$MADMAIL_GID" "$$d"
            fi
            chmod 0700 "$$d"
          done
        }
        if [ -f "$$conf" ]; then
          echo "madmail: $$conf exists; skipping install"
          own
          exit 0
        fi
        # --local (Madmail 2.41+): write only the config, TLS files and
        # state; the image already has the binary, and there is no service
        # account or systemd. Older images only know the system install.
        if /bin/madmail install --help 2>/dev/null | grep -q -- '--local'; then
          set -- install --simple --non-interactive --local \
            --config-dir /etc/madmail --state-dir /var/lib/madmail
        else
          set -- install --simple --non-interactive --skip-systemd --skip-user
        fi
        set -- "$$@" --ip "$$MADMAIL_PUBLIC_IP" --lang "$$MADMAIL_LANG"
        if [ -n "$$MADMAIL_DOMAIN" ]; then
          set -- "$$@" --domain "$$MADMAIL_DOMAIN" --hostname "$${MADMAIL_HOSTNAME:-$$MADMAIL_DOMAIN}"
        fi
        if [ -n "$$MADMAIL_TLS_MODE" ]; then
          set -- "$$@" --tls-mode "$$MADMAIL_TLS_MODE"
          case "$$MADMAIL_TLS_MODE" in
            # file: fullchain.pem / privkey.pem must already be in certs/.
            self_signed|file) set -- "$$@" --no-obtain-certificate ;;
          esac
        fi
        if [ -n "$$MADMAIL_ACME_EMAIL" ]; then
          set -- "$$@" --acme-email "$$MADMAIL_ACME_EMAIL"
        fi
        if [ "$$MADMAIL_ENABLE_IROH" = "true" ]; then
          set -- "$$@" --enable-iroh
        fi
        # Intentionally unquoted: split extra flags on whitespace.
        # shellcheck disable=SC2086
        set -- "$$@" $$MADMAIL_INSTALL_EXTRA_ARGS
        echo "madmail: running madmail $$*"
        /bin/madmail "$$@"
        if [ -n "$$MADMAIL_RELAY_PORT_MIN" ] && ! grep -q relay_port_min "$$conf"; then
          awk -v min="$$MADMAIL_RELAY_PORT_MIN" -v max="$$MADMAIL_RELAY_PORT_MAX" '
            { print }
            /^turn[[:space:]]/ { in_turn = 1 }
            in_turn && /^[[:space:]]*relay_ip[[:space:]]/ {
              print "    relay_port_min " min
              print "    relay_port_max " max
              in_turn = 0
            }
          ' "$$conf" > "$$conf.tmp"
          mv "$$conf.tmp" "$$conf"
          echo "madmail: TURN relay range set to $$MADMAIL_RELAY_PORT_MIN-$$MADMAIL_RELAY_PORT_MAX"
        fi
        chmod 0600 "$$conf"
        own

  madmail:
    image: *madmail-image
    container_name: ${MADMAIL_CONTAINER_NAME:-madmail}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # Non-root with no capabilities: Docker lets containers on a bridge
    # network bind ports below 1024 (net.ipv4.ip_unprivileged_port_start=0).
    # compose.host-network.yaml switches to root with NET_BIND_SERVICE only.
    user: "${MADMAIL_UID:-999}:${MADMAIL_GID:-999}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/madmail:uid=${MADMAIL_UID:-999},gid=${MADMAIL_GID:-999},mode=0700
    stop_grace_period: 30s
    ports:
      - "${MADMAIL_BIND_IP:-0.0.0.0}:25:25"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:80:80"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:443:443"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:143:143"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:465:465"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:587:587"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:993:993"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:8388:8388"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:3340:3340"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:3478:3478/udp"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:3478:3478/tcp"
      # TURN relay media: a small range, pinned in madmail.conf by bootstrap.
      # For the full range and real client IPs use compose.host-network.yaml.
      - "${MADMAIL_BIND_IP:-0.0.0.0}:${MADMAIL_TURN_RELAY_MIN:-50000}-${MADMAIL_TURN_RELAY_MAX:-50099}:${MADMAIL_TURN_RELAY_MIN:-50000}-${MADMAIL_TURN_RELAY_MAX:-50099}/udp"
    volumes:
      - ${MADMAIL_STATE_DIR:-/var/lib/madmail}:/var/lib/madmail
      # Writable: with tls_mode autocert the in-process renewal job rewrites
      # /etc/madmail/certs/*.pem, and `madmail monitor enable` / `iroh install`
      # edit madmail.conf.
      - ${MADMAIL_CONFIG_DIR:-/etc/madmail}:/etc/madmail
    healthcheck:
      # No HTTP health route exists; a TCP connect to IMAPS is the liveness signal.
      test: ["CMD", "nc", "-z", "127.0.0.1", "993"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
