# Madmail — Docker Compose deployment.
#
#   cd deploy/docker
#   cp .env.example .env        # then edit .env
#   docker compose up -d
#
# Production calls (TURN) work best with host networking:
#   docker compose -f compose.yaml -f compose.host-network.yaml up -d
#
# The one-shot `bootstrap` service runs `madmail install` the first time
# (when ${MADMAIL_CONFIG_DIR}/madmail.conf does not exist yet) and exits.
# `madmail` starts only after bootstrap succeeds. Later `up` runs skip the
# install because the config is already present.
#
# Full guide: docs/guide/docker.md#docker-compose-example

x-madmail-image: &madmail-image ${MADMAIL_IMAGE:-ghcr.io/themadorg/madmail:latest}

services:
  bootstrap:
    image: *madmail-image
    restart: "no"
    cap_add:
      - NET_BIND_SERVICE
    # Port 80 is only needed for Let's Encrypt HTTP-01 during the first install.
    # The container exits before `madmail` binds the same host port.
    ports:
      - "${MADMAIL_BIND_IP:-0.0.0.0}:80:80"
    environment:
      MADMAIL_DOMAIN: ${MADMAIL_DOMAIN:-}
      MADMAIL_HOSTNAME: ${MADMAIL_HOSTNAME:-}
      MADMAIL_PUBLIC_IP: ${MADMAIL_PUBLIC_IP:?set MADMAIL_PUBLIC_IP in .env (public IP clients reach)}
      MADMAIL_TLS_MODE: ${MADMAIL_TLS_MODE:-}
      MADMAIL_ACME_EMAIL: ${MADMAIL_ACME_EMAIL:-}
      MADMAIL_LANG: ${MADMAIL_LANG:-en}
      MADMAIL_ENABLE_IROH: ${MADMAIL_ENABLE_IROH:-false}
      MADMAIL_INSTALL_EXTRA_ARGS: ${MADMAIL_INSTALL_EXTRA_ARGS:-}
    volumes:
      - ${MADMAIL_STATE_DIR:-/var/lib/madmail}:/var/lib/madmail
      - ${MADMAIL_CONFIG_DIR:-/etc/madmail}:/etc/madmail
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /etc/madmail/madmail.conf ]; then
          echo "madmail: /etc/madmail/madmail.conf exists; skipping install"
          exit 0
        fi
        set -- install --simple --non-interactive --skip-systemd --skip-user \
          --ip "$$MADMAIL_PUBLIC_IP" --lang "$$MADMAIL_LANG"
        if [ -n "$$MADMAIL_DOMAIN" ]; then
          set -- "$$@" --domain "$$MADMAIL_DOMAIN" --hostname "$${MADMAIL_HOSTNAME:-$$MADMAIL_DOMAIN}"
        fi
        if [ -n "$$MADMAIL_TLS_MODE" ]; then
          set -- "$$@" --tls-mode "$$MADMAIL_TLS_MODE"
          if [ "$$MADMAIL_TLS_MODE" = "self_signed" ]; then
            set -- "$$@" --no-obtain-certificate
          fi
        fi
        if [ -n "$$MADMAIL_ACME_EMAIL" ]; then
          set -- "$$@" --acme-email "$$MADMAIL_ACME_EMAIL"
        fi
        if [ "$$MADMAIL_ENABLE_IROH" = "true" ]; then
          set -- "$$@" --enable-iroh
        fi
        # Intentionally unquoted: split extra flags on whitespace.
        # shellcheck disable=SC2086
        set -- "$$@" $$MADMAIL_INSTALL_EXTRA_ARGS
        echo "madmail: running madmail $$*"
        exec /bin/madmail "$$@"

  madmail:
    image: *madmail-image
    container_name: ${MADMAIL_CONTAINER_NAME:-madmail}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 30s
    ports:
      - "${MADMAIL_BIND_IP:-0.0.0.0}:25:25"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:80:80"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:443:443"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:143:143"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:465:465"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:587:587"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:993:993"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:8388:8388"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:3340:3340"
      - "${MADMAIL_BIND_IP:-0.0.0.0}:3478:3478/udp"
      # TURN relay media. The default 49152-65535 range creates many port
      # mappings; for production calls prefer compose.host-network.yaml.
      - "${MADMAIL_BIND_IP:-0.0.0.0}:${MADMAIL_TURN_RELAY_PORTS:-49152-65535}:${MADMAIL_TURN_RELAY_PORTS:-49152-65535}/udp"
    volumes:
      - ${MADMAIL_STATE_DIR:-/var/lib/madmail}:/var/lib/madmail
      # Writable: with tls_mode autocert the in-process renewal job rewrites
      # /etc/madmail/certs/*.pem, and `madmail monitor enable` / `iroh install`
      # edit madmail.conf.
      - ${MADMAIL_CONFIG_DIR:-/etc/madmail}:/etc/madmail
      - madmail-run:/run/madmail
    healthcheck:
      # No HTTP health route exists; a TCP connect to IMAPS is the liveness signal.
      test: ["CMD", "nc", "-z", "127.0.0.1", "993"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  madmail-run:
