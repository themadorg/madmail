{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "madmail.fullname" . }}
  labels:
    {{- include "madmail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "madmail.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Public mail, web, TURN and proxy ports: any source.
    - ports:
        {{- range (include "madmail.ports" . | fromYamlArray) }}
        - port: {{ .port }}
          protocol: {{ .protocol }}
        {{- end }}
    {{- if and .Values.madmail.metrics.enabled .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: {{ .Values.madmail.metrics.port }}
          protocol: TCP
    {{- end }}
{{- end }}
