{{- $fullname := include "madmail.fullname" . }}
{{- $m := .Values.madmail }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "madmail.labels" . | nindent 4 }}
spec:
  # SQLite state and directly bound mail ports: exactly one pod.
  replicas: 1
  serviceName: {{ $fullname }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "madmail.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "madmail.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "madmail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: bootstrap
          image: {{ include "madmail.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          {{- /* install writes the binary, man pages and shell completions to
                 the root filesystem, so this container keeps it writable. */}}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) (dict "readOnlyRootFilesystem" false)) | nindent 12 }}
          env:
            {{- include "madmail.bootstrapEnv" . | nindent 12 }}
          {{- if eq $m.tls.mode "autocert" }}
          ports:
            # Let's Encrypt HTTP-01 during the first install.
            - name: http
              containerPort: 80
              protocol: TCP
          {{- end }}
          volumeMounts:
            {{- include "madmail.volumeMounts" . | nindent 12 }}
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          {{- with .Values.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: madmail
          image: {{ include "madmail.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $m.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range (include "madmail.ports" . | fromYamlArray) }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
            {{- if $m.metrics.enabled }}
            - name: metrics
              containerPort: {{ $m.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "madmail.volumeMounts" . | nindent 12 }}
            - name: run
              mountPath: /run/madmail
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: bootstrap
          configMap:
            name: {{ $fullname }}-bootstrap
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $m.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ $m.tls.existingSecret }}
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
        {{- end }}
        {{- with .Values.persistence.state.existingClaim }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.config.existingClaim }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- $claims := list }}
  {{- if not .Values.persistence.state.existingClaim }}
  {{- $claims = append $claims (dict "name" "state" "p" .Values.persistence.state) }}
  {{- end }}
  {{- if not .Values.persistence.config.existingClaim }}
  {{- $claims = append $claims (dict "name" "config" "p" .Values.persistence.config) }}
  {{- end }}
  {{- if $claims }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    {{- range $claims }}
    - metadata:
        name: {{ .name }}
        {{- with .p.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .p.accessModes | nindent 10 }}
        {{- with .p.storageClass }}
        {{- if eq . "-" }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ . }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .p.size }}
    {{- end }}
  {{- end }}
