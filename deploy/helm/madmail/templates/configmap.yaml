{{- include "madmail.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "madmail.fullname" . }}-bootstrap
  labels:
    {{- include "madmail.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    #!/bin/sh
    # Runs as an init container before every madmail start.
    #  1. First start only: `madmail install` writes /etc/madmail/madmail.conf,
    #     TLS PEMs and the initial databases.
    #  2. Every start: apply the settings the chart keeps managing
    #     (admin web UI, metrics listener).
    set -eu
    CONF=/etc/madmail/madmail.conf
    mm() { /bin/madmail "$@"; }

    if [ -f "$CONF" ]; then
      echo "bootstrap: $CONF exists; skipping install"
    else
      # --local: write only the config, TLS files and state; the image
      # already has the binary, and there is no service account or systemd.
      # It also runs without root.
      set -- install --simple --non-interactive --local \
        --config-dir /etc/madmail --state-dir /var/lib/madmail \
        --ip "$MADMAIL_PUBLIC_IP" --lang "$MADMAIL_LANG"
      if [ -n "${MADMAIL_DOMAIN:-}" ]; then
        set -- "$@" --domain "$MADMAIL_DOMAIN" --hostname "${MADMAIL_HOSTNAME:-$MADMAIL_DOMAIN}"
      fi
      case "${MADMAIL_TLS_MODE:-}" in
        "") ;;
        self_signed) set -- "$@" --tls-mode self_signed --no-obtain-certificate ;;
        file)
          set -- "$@" --tls-mode file --no-obtain-certificate \
            --cert-path /etc/madmail/certs/fullchain.pem \
            --key-path /etc/madmail/certs/privkey.pem
          ;;
        *) set -- "$@" --tls-mode "$MADMAIL_TLS_MODE" ;;
      esac
      if [ -n "${MADMAIL_ACME_EMAIL:-}" ]; then
        set -- "$@" --acme-email "$MADMAIL_ACME_EMAIL"
      fi
      if [ "${MADMAIL_ENABLE_IROH:-false}" = "true" ]; then
        set -- "$@" --enable-iroh
      fi
      {{- range .Values.madmail.installExtraArgs }}
      set -- "$@" {{ printf "'%s'" (replace "'" "'\\''" (toString .)) }}
      {{- end }}

      echo "bootstrap: madmail $*"
      # install obtains TLS before it writes madmail.conf, so a failed ACME
      # challenge leaves no config behind and is retried on the next start.
      mm "$@"
    fi

    # Pin the TURN relay range to the ports this chart publishes. Runs on every
    # start (guarded) so an install interrupted after writing madmail.conf
    # still gets it.
    if [ -n "${MADMAIL_RELAY_PORT_MIN:-}" ] && ! grep -q 'relay_port_min' "$CONF"; then
      awk -v min="$MADMAIL_RELAY_PORT_MIN" -v max="$MADMAIL_RELAY_PORT_MAX" '
        { print }
        /^turn[[:space:]]/ { in_turn = 1 }
        in_turn && /^[[:space:]]*relay_ip[[:space:]]/ {
          print "    relay_port_min " min
          print "    relay_port_max " max
          in_turn = 0
        }
      ' "$CONF" > "$CONF.tmp"
      mv "$CONF.tmp" "$CONF"
      echo "bootstrap: TURN relay range set to $MADMAIL_RELAY_PORT_MIN-$MADMAIL_RELAY_PORT_MAX"
    fi
    # madmail.conf holds the TURN and Shadowsocks secrets.
    chmod 0600 "$CONF"

    # admin-web writes the settings DB and then tries to soft-reload a running
    # server through the public admin URL. Nothing is running yet, so only
    # call it when the state differs, and bound the reload attempt.
    admin_web() {
      rc=0
      timeout 60 /bin/madmail admin-web "$@" || rc=$?
      case "$rc" in
        0) ;;
        124|143) echo "bootstrap: admin-web $1 applied; reload attempt timed out" ;;
        *) return "$rc" ;;
      esac
    }
    status="$(mm --json admin-web status)"
    want_enabled="${MADMAIL_ADMIN_WEB_ENABLED:-false}"
    case "$status" in
      *'"enabled":true'*) have_enabled=true ;;
      *) have_enabled=false ;;
    esac
    if [ "$want_enabled" = "true" ]; then
      case "$status" in
        *"\"path\":\"$MADMAIL_ADMIN_WEB_PATH\""*) ;;
        *) admin_web path "$MADMAIL_ADMIN_WEB_PATH" ;;
      esac
      [ "$have_enabled" = "true" ] || admin_web enable
    elif [ "$have_enabled" = "true" ]; then
      admin_web disable
    fi

    # The chart owns the metrics listener: enforce both states on every start.
    if [ "${MADMAIL_METRICS_ENABLED:-false}" = "true" ]; then
      if [ -n "${MADMAIL_MONITOR_PASSWORD:-}" ]; then
        # The password is read from MADMAIL_MONITOR_PASSWORD, not argv.
        mm monitor enable --ip 0.0.0.0 --port "$MADMAIL_METRICS_PORT" \
          --username "$MADMAIL_METRICS_USERNAME"
      else
        mm monitor enable --ip 0.0.0.0 --port "$MADMAIL_METRICS_PORT" --clear-password
      fi
    else
      mm monitor disable
    fi
    echo "bootstrap: done"
